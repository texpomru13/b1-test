# Minimal CI: lint + type check + unit tests. Downloads no models, needs no API keys.
# Running on ubuntu-latest (amd64) also closes the ADR 001 amd64 runtime import smoke.
name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - name: Sync environment (frozen)
        run: |
          uv lock --check
          uv sync --frozen
      - name: Ruff
        run: uv run ruff check app tests scripts services/local-models/app_lm eval
      - name: Validate launcher and Compose configuration
        run: |
          sh -n run
          sh -n scripts/probe.sh
          sh -n eval/demo.sh
          for overlay in compose.*.yaml; do
            docker compose -f compose.yaml -f "$overlay" config --quiet
          done
      - name: Mypy
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest tests/unit -q

  storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:8.10.3@sha256:1f88291b4c57bdf249f02eb085a8669889b2d2954e91d4de5118a5da6b78dd53
        ports: ["6379:6379"]
      qdrant:
        image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
        ports: ["6333:6333"]
    env:
      B1_REQUIRE_STORES: "1"
      B1_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      B1_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.7"
      - run: uv sync --frozen
      - name: Verify publication, isolation, cleanup, lease ownership and redelivery
        run: |
          docker info >/dev/null
          uv run --frozen pytest -q tests/integration/test_{published_storage,lifecycle_redis,requeue_redis}.py --junitxml=storage.xml
          python -c 'import xml.etree.ElementTree as E; assert not E.parse("storage.xml").findall(".//skipped"), "required storage test skipped"'
