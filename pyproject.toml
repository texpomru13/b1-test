[project]
name = "rag-backend"
version = "0.1.0"
description = "Document QA RAG backend: FastAPI + Celery/Redis + Qdrant + LangGraph/LangChain"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "celery[redis]==5.7.0",
    "redis==8.1.0",
    "qdrant-client==1.20.0",
    "langgraph==1.2.20",
    "langchain-core==1.7.7",
    "langchain==1.4.10",
    "langchain-text-splitters==1.1.3",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.7.4",
    "langchain-anthropic==1.7.10",
    "fastembed==0.9.1",
    "pypdf==7.0.1",
    "httpx==0.28.1",
    "structlog==26.1.0",
    "python-multipart==0.0.33",
    "tokenizers==0.23.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.4",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
]

# Virtual project: dependencies are installed, the `app` package is used from the
# working directory (see Dockerfile / pytest pythonpath). No build backend needed.
[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "RUF"]
# Russian is the project's domain language: Cyrillic in literals is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/helpers/pdfgen.py" = ["E501"]  # OOXML namespace URLs inside string literals

[tool.mypy]
python_version = "3.12"
files = ["app"]
strict_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
